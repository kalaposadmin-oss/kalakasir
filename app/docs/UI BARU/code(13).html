<!DOCTYPE html>
<html lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#7BAE9E",
                        "accent-blue": "#94B3C5",
                        "background-light": "#F8FAF9",
                        "background-dark": "#121816",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "full": "9999px" },
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        body {
            min-height: 100dvh;
            -webkit-tap-highlight-color: transparent;
        }
        .ios-shadow {
            box-shadow: 0 4px 12px -2px rgba(0, 0, 0, 0.05);
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-800 dark:text-slate-100 antialiased">
<div class="relative flex min-h-screen w-full flex-col overflow-x-hidden">
<header class="sticky top-0 z-30 bg-white/80 dark:bg-background-dark/80 backdrop-blur-xl border-b border-slate-200/50 dark:border-slate-800/50">
<div class="flex items-center gap-3 px-4 py-3">
<button class="flex h-10 w-10 items-center justify-center rounded-full active:bg-slate-100 dark:active:bg-slate-800 transition-colors">
<span class="material-symbols-outlined text-slate-600 dark:text-slate-300">arrow_back</span>
</button>
<h1 class="text-lg font-bold tracking-tight">Pembayaran</h1>
</div>
</header>
<main class="flex-1 px-4 py-6 space-y-6">
<div class="text-center py-4">
<p class="text-sm font-medium text-slate-500 dark:text-slate-400">Total Tagihan</p>
<h2 class="text-3xl font-extrabold text-slate-900 dark:text-white mt-1 tracking-tight">Rp 45.000</h2>
</div>
<div class="grid grid-cols-2 gap-3">
<button class="flex flex-col items-center justify-center gap-2 p-4 rounded-2xl border-2 border-primary bg-primary/5 dark:bg-primary/10 transition-all">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1">payments</span>
<span class="text-sm font-bold text-primary">Tunai</span>
</button>
<button class="flex flex-col items-center justify-center gap-2 p-4 rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 active:bg-slate-50 transition-all">
<span class="material-symbols-outlined text-slate-400">qr_code_2</span>
<span class="text-sm font-semibold text-slate-600 dark:text-slate-300">QRIS</span>
</button>
<button class="flex flex-col items-center justify-center gap-2 p-4 rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 active:bg-slate-50 transition-all">
<span class="material-symbols-outlined text-slate-400">account_balance</span>
<span class="text-sm font-semibold text-slate-600 dark:text-slate-300">Transfer</span>
</button>
<button class="flex flex-col items-center justify-center gap-2 p-4 rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 active:bg-slate-50 transition-all">
<span class="material-symbols-outlined text-slate-400">account_balance_wallet</span>
<span class="text-sm font-semibold text-slate-600 dark:text-slate-300">E-Wallet</span>
</button>
</div>
<div class="space-y-4">
<div class="relative">
<label class="absolute -top-2.5 left-4 bg-background-light dark:bg-background-dark px-2 text-[10px] font-bold text-slate-400 uppercase tracking-widest">Uang Diterima</label>
<div class="flex items-center w-full rounded-2xl border-2 border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 px-4 py-4 focus-within:border-primary transition-colors">
<span class="text-lg font-bold text-slate-400 mr-2">Rp</span>
<input class="w-full border-none p-0 text-2xl font-bold bg-transparent focus:ring-0 text-slate-900 dark:text-white" readonly="" type="text" value="50.000"/>
</div>
</div>
<div class="flex gap-2">
<button class="flex-1 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm font-semibold text-slate-600 dark:text-slate-300 active:bg-slate-50">50rb</button>
<button class="flex-1 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm font-semibold text-slate-600 dark:text-slate-300 active:bg-slate-50">100rb</button>
<button class="flex-1 py-2.5 rounded-xl border border-primary/30 bg-primary/10 text-sm font-bold text-primary active:bg-primary/20">Uang Pas</button>
</div>
<div class="bg-primary rounded-2xl p-4 text-white ios-shadow">
<div class="flex justify-between items-center">
<span class="text-sm font-medium opacity-90">Kembalian</span>
<span class="material-symbols-outlined">payments</span>
</div>
<p class="text-2xl font-bold mt-1">Rp 5.000</p>
</div>
</div>
<div class="flex items-center justify-between p-4 bg-white dark:bg-slate-900 rounded-2xl border border-slate-100 dark:border-slate-800">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-slate-400">print</span>
<span class="text-sm font-semibold">Cetak Struk</span>
</div>
<button class="relative inline-flex h-6 w-11 items-center rounded-full bg-primary">
<span class="inline-block h-5 w-5 translate-x-5.5 transform rounded-full bg-white shadow-sm transition-transform"></span>
</button>
</div>
</main>
<div class="fixed bottom-0 left-0 right-0 p-4 bg-white/95 dark:bg-background-dark/95 backdrop-blur-md border-t border-slate-200/50 dark:border-slate-800/50 pb-safe">
<button class="w-full flex items-center justify-center gap-2 rounded-2xl bg-primary py-4 text-base font-bold text-white shadow-lg shadow-primary/20 active:scale-[0.98] transition-all">
                Konfirmasi Pembayaran
                <span class="material-symbols-outlined text-xl">check_circle</span>
</button>
</div>
</div>

</body></html>

<!DOCTYPE html>
<html lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#7BAE9E", // Muted Sage/Teal
                        "accent-blue": "#94B3C5",
                        "background-light": "#F8FAF9",
                        "background-dark": "#121816",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        body {
            min-height: 800px;
            -webkit-tap-highlight-color: transparent;
        }
        .ios-shadow {
            box-shadow: 0 4px 12px -2px rgba(0, 0, 0, 0.05);
        }
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom);
        }
        .ios-shadow-lg {
            box-shadow: 0 10px 25px -5px rgba(123, 174, 158, 0.15);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-800 dark:text-slate-100 antialiased">
<div class="relative flex min-h-screen w-full flex-col overflow-x-hidden pb-24">
<header class="sticky top-0 z-30 flex items-center justify-between bg-white/70 dark:bg-background-dark/80 backdrop-blur-xl px-4 py-4 border-b border-slate-200/50 dark:border-slate-800/50">
<div class="flex items-center gap-3">
<h1 class="text-xl font-bold leading-tight tracking-tight">Produk</h1>
</div>
<div class="flex items-center gap-2">
<button class="flex h-10 w-10 items-center justify-center rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">
<span class="material-symbols-outlined">search</span>
</button>
<button class="flex h-10 w-10 items-center justify-center rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">
<span class="material-symbols-outlined">filter_list</span>
</button>
</div>
</header>
<main class="flex-1 flex flex-col items-center justify-center px-8 py-12 text-center">
<div class="mb-8 flex items-center justify-center">
<div class="relative">
<div class="absolute inset-0 scale-150 bg-primary/5 rounded-full blur-2xl"></div>
<div class="relative flex size-32 items-center justify-center rounded-[2.5rem] bg-white dark:bg-slate-900 ios-shadow-lg border border-slate-100 dark:border-slate-800">
<span class="material-symbols-outlined text-primary text-6xl" style="font-variation-settings: 'wght' 200">inventory_2</span>
</div>
</div>
</div>
<h2 class="text-xl font-bold tracking-tight text-slate-800 dark:text-white mb-2">
                Belum ada produk
            </h2>
<p class="text-sm text-slate-500 dark:text-slate-400 max-w-[240px] leading-relaxed mb-10">
                Mulai dengan menambahkan produk dagangan Anda
            </p>
<button class="flex w-full max-w-[280px] items-center justify-center gap-2 rounded-2xl bg-primary py-4 px-6 text-white ios-shadow-lg active:scale-[0.98] transition-transform">
<span class="material-symbols-outlined font-bold text-xl">add</span>
<span class="text-base font-bold tracking-wide">Tambah Produk</span>
</button>
</main>
<nav class="fixed bottom-0 left-0 right-0 z-40 flex h-20 items-center border-t border-slate-200/50 dark:border-slate-800/50 bg-white/90 dark:bg-slate-900/95 backdrop-blur-xl px-2 pb-safe">
<a class="flex flex-1 flex-col items-center justify-center gap-1 text-slate-400 dark:text-slate-500" href="#">
<span class="material-symbols-outlined">dashboard</span>
<span class="text-[10px] font-medium tracking-tight">Dashboard</span>
</a>
<a class="flex flex-1 flex-col items-center justify-center gap-1 text-slate-400 dark:text-slate-500" href="#">
<span class="material-symbols-outlined">point_of_sale</span>
<span class="text-[10px] font-medium tracking-tight">Kasir</span>
</a>
<a class="flex flex-1 flex-col items-center justify-center gap-1 text-slate-400 dark:text-slate-500" href="#">
<span class="material-symbols-outlined">history</span>
<span class="text-[10px] font-medium tracking-tight">Riwayat</span>
</a>
<a class="flex flex-1 flex-col items-center justify-center gap-1 text-primary" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1">inventory_2</span>
<span class="text-[10px] font-bold tracking-tight">Produk</span>
</a>
<a class="flex flex-1 flex-col items-center justify-center gap-1 text-slate-400 dark:text-slate-500" href="#">
<span class="material-symbols-outlined">settings</span>
<span class="text-[10px] font-medium tracking-tight">Setelan</span>
</a>
</nav>
</div>

</body></html>

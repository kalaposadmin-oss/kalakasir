<!DOCTYPE html>
<html lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#7BAE9E",
                        "background-light": "#F8FAF9",
                        "background-dark": "#121816",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        body {
            height: 100dvh;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        .pin-dot {
            @apply size-4 rounded-full border-2 border-primary/30;
        }
        .pin-dot.filled {
            @apply bg-primary border-primary;
        }
        .key-btn {
            @apply flex h-20 w-20 items-center justify-center rounded-full text-2xl font-semibold transition-all active:bg-slate-100 dark:active:bg-slate-800;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-800 dark:text-slate-100 antialiased">
<div class="relative flex h-full w-full flex-col max-w-[360px] mx-auto overflow-hidden">
<header class="flex items-center px-4 py-6">
<button class="flex h-10 w-10 items-center justify-center rounded-full text-slate-600 dark:text-slate-300 active:bg-slate-100 dark:active:bg-slate-800">
<span class="material-symbols-outlined">arrow_back_ios_new</span>
</button>
</header>
<main class="flex flex-1 flex-col items-center px-6">
<div class="mt-8 text-center">
<h1 class="text-xl font-bold tracking-tight text-slate-800 dark:text-slate-100">Masukkan PIN Kasir</h1>
<p class="mt-2 text-sm font-medium text-slate-500 dark:text-slate-400">Silakan masukkan PIN untuk membuka shift</p>
</div>
<div class="mt-12 flex gap-8">
<div class="pin-dot"></div>
<div class="pin-dot"></div>
<div class="pin-dot"></div>
<div class="pin-dot"></div>
</div>
<div class="mt-auto mb-12 grid grid-cols-3 gap-x-8 gap-y-4">
<button class="key-btn">1</button>
<button class="key-btn">2</button>
<button class="key-btn">3</button>
<button class="key-btn">4</button>
<button class="key-btn">5</button>
<button class="key-btn">6</button>
<button class="key-btn">7</button>
<button class="key-btn">8</button>
<button class="key-btn">9</button>
<div class="flex h-20 w-20 items-center justify-center">
</div>
<button class="key-btn">0</button>
<button class="key-btn text-slate-400">
<span class="material-symbols-outlined text-3xl">backspace</span>
</button>
</div>
</main>
<div class="flex justify-center pb-8">
<button class="flex items-center gap-2 px-4 py-2 text-primary font-bold text-sm">
<span class="material-symbols-outlined text-lg">fingerprint</span>
<span>Gunakan Sidik Jari</span>
</button>
</div>
</div>

</body></html>

name: CI Tests

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run unit tests
        run: php artisan test --testsuite=Unit

  valuation:
    name: Valuation Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run valuation tests
        run: php artisan test --filter='ValuationAuthorizationTest|ValuationAsyncOperationsTest|ValuationWebSmokeTest'

  write-flow:
    name: Write Flow Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run write flow tests
        run: php artisan test --filter='WriteFlowLockPeriodApiEnforcementTest|WriteFlowTransactionDateHappyPathTest|CheckoutTransactionDateValidationTest|PurchaseReceiveTransactionDateValidationTest|StockTransferTransactionDateValidationTest|StockAdjustmentTransactionDateValidationTest|PurchaseReturnConsistencyTest|ProductionBatchQuickFlowTest'
